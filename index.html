<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北成國小相簿彙集</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc; /* Slate-50 */
        }
        .bg-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* Custom Scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }
        .album-card-hover {
            transition: all 0.3s ease;
        }
        .album-card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 bg-pattern relative">

    <!-- Navbar -->
    <header class="bg-teal-700 text-white shadow-md fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo & Title -->
                <div class="flex items-center gap-3">
                    <div class="bg-white text-teal-700 w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl shadow-inner">
                        <i class="fa-solid fa-camera-retro"></i>
                    </div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide">北成國小相簿彙集</h1>
                </div>

                <!-- Navigation Buttons -->
                <div class="flex gap-2 bg-teal-800 p-1 rounded-lg">
                    <button id="btn-view-frontend" onclick="switchView('frontend')" class="px-4 py-2 rounded-md font-medium transition-all duration-200 bg-white text-teal-800 shadow-sm text-sm sm:text-base">
                        <i class="fa-solid fa-images mr-1"></i> 瀏覽相簿
                    </button>
                    <button id="btn-view-admin" onclick="switchView('admin')" class="px-4 py-2 rounded-md font-medium transition-all duration-200 text-teal-100 hover:text-white hover:bg-teal-600 text-sm sm:text-base">
                        <i class="fa-solid fa-gear mr-1"></i> 後台管理
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- FRONTEND VIEW -->
    <main id="view-frontend" class="flex-grow pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        
        <!-- Filters & Search Toolbar -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between sticky top-20 z-30">
            <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                <!-- Category Filter -->
                <div class="relative w-full sm:w-48">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-folder-open"></i>
                    </div>
                    <select id="filterCategory" onchange="renderFrontendList()" class="block w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-teal-500 focus:border-teal-500 appearance-none font-medium">
                        <option value="all">所有分類</option>
                        <!-- Options generated by JS -->
                    </select>
                </div>
                
                <!-- Month Filter -->
                <div class="relative w-full sm:w-48">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-regular fa-calendar-days"></i>
                    </div>
                    <select id="filterMonth" onchange="renderFrontendList()" class="block w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-teal-500 focus:border-teal-500 appearance-none font-medium">
                        <option value="all">所有月份</option>
                        <!-- Options generated by JS -->
                    </select>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full sm:w-72">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" id="searchInput" onkeyup="renderFrontendList()" placeholder="搜尋相簿名稱..." class="block w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-teal-500 focus:border-teal-500 placeholder-slate-400">
            </div>
        </div>

        <!-- Album List Container (List View) -->
        <div id="frontendAlbumsContainer" class="flex flex-col gap-4">
            <!-- Loading State -->
            <div class="flex justify-center items-center py-20 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mr-3"></i>
                <span class="text-lg">載入雲端資料中...</span>
            </div>
        </div>
        
        <!-- Empty State (Hidden by default) -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 px-4 text-center">
            <div class="bg-slate-100 p-6 rounded-full mb-4">
                <i class="fa-regular fa-folder-open text-4xl text-slate-400"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-700 mb-2">找不到相簿</h3>
            <p class="text-slate-500 max-w-md">目前還沒有新增任何相簿，或是沒有符合您搜尋條件的結果。</p>
        </div>
    </main>

    <!-- ADMIN VIEW (Hidden by default) -->
    <main id="view-admin" class="hidden flex-grow pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <h2 class="text-2xl font-bold text-slate-800"><i class="fa-solid fa-shield-halved text-teal-600 mr-2"></i>後台管理 (雲端同步中)</h2>
            <div class="flex gap-2">
                <button onclick="openChangePwdModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-key"></i> <span class="hidden sm:inline">修改密碼</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Column: Category Management -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 h-fit">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-2">
                    <i class="fa-solid fa-tags text-teal-500"></i> 分類管理
                </h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newCategoryInput" placeholder="輸入新分類名稱" class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" onkeypress="if(event.key === 'Enter') addCategory()">
                    <button onclick="addCategory()" class="bg-teal-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-teal-700 transition">
                        新增
                    </button>
                </div>
                <ul id="adminCategoryList" class="space-y-2 max-h-64 overflow-y-auto pr-2">
                    <!-- Category list generated by JS -->
                </ul>
            </div>

            <!-- Right Column: Add/Edit Album Form & List -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Add/Edit Form -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 id="formTitle" class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-plus-circle text-teal-500"></i> 新增相簿資料
                    </h3>
                    
                    <input type="hidden" id="editAlbumId">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">相簿標題 <span class="text-red-500">*</span></label>
                            <input type="text" id="albumTitle" placeholder="例如：112學年度畢業典禮" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">活動日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="albumDate" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">所屬分類 <span class="text-red-500">*</span></label>
                            <select id="albumCategory" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:outline-none">
                                <!-- Options generated by JS -->
                            </select>
                        </div>
                        
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">相簿連結 (URL) <span class="text-red-500">*</span></label>
                            <input type="url" id="albumUrl" placeholder="https://..." class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:outline-none">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 flex justify-between items-end mb-1">
                                <span>封面圖片網址 (選填)</span>
                                <span class="text-xs text-slate-500 font-normal">留空將自動產生精美圖卡</span>
                            </label>
                            <input type="url" id="albumCoverUrl" placeholder="請貼上圖片的真實網址 (以 .jpg, .png 結尾或 lh3.googleusercontent.com 開頭)" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:outline-none" oninput="checkCoverUrlWarning()">
                            <div id="coverUrlWarning" class="text-red-500 text-xs mt-1 hidden">
                                <i class="fa-solid fa-triangle-exclamation"></i> 提醒：您似乎貼上了相簿「網頁」網址，請在照片上按右鍵選擇「複製圖片位址」，或直接留空由系統自動產圖。
                            </div>
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">相簿說明 (選填)</label>
                            <textarea id="albumDesc" rows="3" placeholder="輸入關於此相簿的簡短說明..." class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:outline-none resize-none"></textarea>
                        </div>
                    </div>
                    
                    <div class="flex justify-end gap-3">
                        <button type="button" onclick="resetForm()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition font-medium">清空重填</button>
                        <button type="button" id="btnSaveAlbum" onclick="saveAlbum()" class="px-6 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition font-medium shadow-sm">
                            <i class="fa-solid fa-cloud-arrow-up mr-1"></i> 儲存資料
                        </button>
                    </div>
                </div>

                <!-- Admin Album List -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-6 py-4 border-b bg-slate-50 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-list-ul text-teal-500 mr-2"></i>已發布相簿列表</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-100 text-slate-700 uppercase font-semibold">
                                <tr>
                                    <th class="px-4 py-3">日期</th>
                                    <th class="px-4 py-3">分類</th>
                                    <th class="px-4 py-3">標題</th>
                                    <th class="px-4 py-3 text-right">管理操作</th>
                                </tr>
                            </thead>
                            <tbody id="adminAlbumList" class="divide-y divide-slate-200">
                                <!-- Admin list generated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modals & Overlays -->
    
    <!-- Custom Message Box -->
    <div id="msgBox" class="fixed bottom-5 right-5 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-[100] flex items-center gap-3">
        <i class="fa-solid fa-circle-info text-teal-400"></i>
        <span id="msgText">提示訊息</span>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-overlay" onclick="closeDeleteModal()"></div>
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden w-full max-w-sm z-10 p-6 relative text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-2xl">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">確定要刪除嗎？</h3>
            <p class="text-slate-500 mb-6 text-sm">此動作無法復原，請確認是否繼續。</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeDeleteModal()" class="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200 transition-colors w-full">取消</button>
                <button id="btnConfirmDelete" class="px-5 py-2.5 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 transition-colors w-full">確定刪除</button>
            </div>
        </div>
    </div>

    <!-- Password Login Modal -->
    <div id="pwdModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-overlay" onclick="closePwdModal()"></div>
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-sm z-10 p-6 relative">
            <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-lock text-teal-600"></i> 請輸入後台密碼
            </h3>
            <p class="text-xs text-slate-500 mb-4">預設管理員密碼為：88888</p>
            <input type="password" id="adminPwdInput" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:outline-none focus:ring-teal-500 focus:border-teal-500 mb-4" placeholder="請輸入密碼" onkeypress="if(event.key === 'Enter') verifyPassword()">
            <div id="pwdError" class="text-red-500 text-sm hidden mb-4">密碼錯誤，請重試。</div>
            <div class="flex justify-end gap-3">
                <button onclick="closePwdModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200 transition-colors">取消</button>
                <button onclick="verifyPassword()" class="px-4 py-2 bg-teal-600 text-white rounded-lg font-medium hover:bg-teal-700 transition-colors shadow-sm">登入</button>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div id="changePwdModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-overlay" onclick="closeChangePwdModal()"></div>
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-sm z-10 p-6 relative">
            <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-key text-teal-600"></i> 修改後台密碼
            </h3>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">舊密碼</label>
                    <input type="password" id="oldPwdInput" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:outline-none focus:ring-teal-500 focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">新密碼</label>
                    <input type="password" id="newPwdInput" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:outline-none focus:ring-teal-500 focus:border-teal-500" placeholder="最少 4 個字元">
                </div>
            </div>
            <div id="changePwdError" class="text-red-500 text-sm hidden mb-4"></div>
            <div class="flex justify-end gap-3">
                <button onclick="closeChangePwdModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200 transition-colors">取消</button>
                <button onclick="saveNewPassword()" class="px-4 py-2 bg-teal-600 text-white rounded-lg font-medium hover:bg-teal-700 transition-colors shadow-sm">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- Application Logic & Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment Variables Injection Safeties
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-album-app';
        
        // ==========================================
        // ⚠️ 請在這裡填入您的專屬 Firebase 設定 ⚠️
        // ==========================================
       
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
let firebaseConfig = {
         apiKey: "AIzaSyAVQpeQutUYHXW7vaeB0ohXxaiDAKAkZjA",
  authDomain: "pcespic.firebaseapp.com",
  projectId: "pcespic",
  storageBucket: "pcespic.firebasestorage.app",
  messagingSenderId: "382784241483",
  appId: "1:382784241483:web:bbffd685a5986dfc0932ce",
  measurementId: "G-DRWFF7F4VC"
        };

        // (這段 try-catch 保留不動，是為了相容目前的測試環境)
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.error("Firebase config parsing error", e);
        }

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // App State
        window.currentUser = null;
        window.albums = [];
        window.categories = [];
        window.adminPassword = '88888'; // Default, will sync from Firebase
        window.isAdminAuthed = false;   // Local session flag for viewing admin UI

        // Firebase Paths (Strict adherence to MANDATORY RULES)
        const albumsPath = `artifacts/${appId}/public/data/albums`;
        const categoriesPath = `artifacts/${appId}/public/data/categories`;
        const settingsPath = `artifacts/${appId}/public/data/settings`;

        // Authenticate User
        async function initAuth() {
            try {
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication failed:", error);
                window.showMessage("無法連接至資料庫伺服器", true);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                initRealtimeListeners();
            }
        });

        // Start App
        initAuth();

        // Data Listeners
        function initRealtimeListeners() {
            if (!window.currentUser) return;

            // Listen for Albums
            onSnapshot(collection(db, albumsPath), (snapshot) => {
                window.albums = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Sort by date descending
                window.albums.sort((a, b) => new Date(b.date) - new Date(a.date));
                window.renderFrontendList();
                if(window.isAdminAuthed) window.renderAdminData();
                populateMonthFilter();
            }, (error) => {
                console.error("Error fetching albums:", error);
            });

            // Listen for Categories
            onSnapshot(collection(db, categoriesPath), (snapshot) => {
                window.categories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Default categories if empty
                if (window.categories.length === 0) {
                    addDefaultCategories();
                } else {
                    window.updateCategoryDropdowns();
                    if(window.isAdminAuthed) window.renderAdminCategoryList();
                    window.renderFrontendList();
                }
            }, (error) => {
                console.error("Error fetching categories:", error);
            });

            // Listen for Settings (Password)
            onSnapshot(doc(db, settingsPath, 'adminAuth'), (docSnap) => {
                if (docSnap.exists()) {
                    window.adminPassword = docSnap.data().password;
                } else {
                    // Create default password document
                    setDoc(doc(db, settingsPath, 'adminAuth'), { password: '88888' }).catch(console.error);
                }
            }, (error) => {
                console.error("Error fetching settings:", error);
            });
        }

        // Setup defaults if first run
        async function addDefaultCategories() {
            if (!window.currentUser) return;
            const defaults = ['校園活動', '畢業典禮', '運動會', '校外教學', '班級日常'];
            for (const name of defaults) {
                try {
                    await addDoc(collection(db, categoriesPath), { name: name, createdAt: new Date().toISOString() });
                } catch (e) { console.error(e); }
            }
        }

        // Expose Firebase CRUD functions to window for HTML event handlers
        
        // Category Management
        window.addCategory = async function() {
            if (!window.currentUser) return;
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();
            if (!name) return;
            
            if (window.categories.some(c => c.name === name)) {
                window.showMessage('此分類已存在！', true);
                return;
            }

            try {
                await addDoc(collection(db, categoriesPath), { name: name, createdAt: new Date().toISOString() });
                input.value = '';
                window.showMessage('分類新增成功！');
            } catch (error) {
                console.error(error);
                window.showMessage('新增失敗，請重試', true);
            }
        };

        window.deleteCategory = async function(id, event) {
            if (!window.currentUser) return;
            if (event) event.stopPropagation();
            
            // Check if used
            if (window.albums.some(a => a.categoryId === id)) {
                window.showMessage('此分類下還有相簿，無法刪除！', true);
                return;
            }

            window.openDeleteConfirm(async () => {
                try {
                    await deleteDoc(doc(db, categoriesPath, id));
                    window.showMessage('分類已刪除！');
                } catch(e) {
                    console.error(e);
                }
            });
        };

        // Album Management
        window.saveAlbum = async function() {
            if (!window.currentUser) return;
            
            const id = document.getElementById('editAlbumId').value;
            const title = document.getElementById('albumTitle').value.trim();
            const date = document.getElementById('albumDate').value;
            const categoryId = document.getElementById('albumCategory').value;
            const url = document.getElementById('albumUrl').value.trim();
            const coverUrl = document.getElementById('albumCoverUrl').value.trim();
            const desc = document.getElementById('albumDesc').value.trim();

            if (!title || !date || !categoryId || !url) {
                window.showMessage('請填寫所有必填欄位（標題、日期、分類、網址）', true);
                return;
            }

            // Generate Fake Short URL for display
            const shortUrlId = Math.random().toString(36).substring(2, 7);
            const shortUrl = `https://bc.link/${shortUrlId}`;

            const albumData = {
                title, date, categoryId, url, coverUrl, desc,
                shortUrl: id ? window.albums.find(a=>a.id===id).shortUrl : shortUrl, // Keep old shortUrl if editing
                updatedAt: new Date().toISOString()
            };

            const btn = document.getElementById('btnSaveAlbum');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...';
            btn.disabled = true;

            try {
                if (id) {
                    // Update
                    await updateDoc(doc(db, albumsPath, id), albumData);
                    window.showMessage('相簿已更新！');
                } else {
                    // Create
                    albumData.createdAt = new Date().toISOString();
                    await addDoc(collection(db, albumsPath), albumData);
                    window.showMessage('相簿新增成功！');
                }
                window.resetForm();
            } catch(e) {
                console.error(e);
                window.showMessage('儲存失敗', true);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.editAlbum = function(id) {
            const album = window.albums.find(a => a.id === id);
            if (!album) return;

            document.getElementById('editAlbumId').value = album.id;
            document.getElementById('albumTitle').value = album.title;
            document.getElementById('albumDate').value = album.date;
            document.getElementById('albumCategory').value = album.categoryId;
            document.getElementById('albumUrl').value = album.url;
            document.getElementById('albumCoverUrl').value = album.coverUrl || '';
            document.getElementById('albumDesc').value = album.desc || '';
            
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-teal-500"></i> 編輯相簿資料';
            window.checkCoverUrlWarning();
            
            // Scroll to form
            document.getElementById('formTitle').scrollIntoView({behavior: 'smooth', block: 'center'});
        };

        window.deleteAlbum = function(id) {
            window.openDeleteConfirm(async () => {
                if (!window.currentUser) return;
                try {
                    await deleteDoc(doc(db, albumsPath, id));
                    window.showMessage('相簿已刪除！');
                } catch(e) { console.error(e); }
            });
        };

        // Password Change
        window.saveNewPassword = async function() {
            if (!window.currentUser) return;
            const oldInput = document.getElementById('oldPwdInput').value;
            const newInput = document.getElementById('newPwdInput').value;
            const err = document.getElementById('changePwdError');

            if (oldInput !== window.adminPassword) {
                err.textContent = '舊密碼輸入錯誤。';
                err.classList.remove('hidden');
                return;
            }
            if (newInput.length < 4) {
                err.textContent = '新密碼長度需至少 4 個字元。';
                err.classList.remove('hidden');
                return;
            }

            try {
                await updateDoc(doc(db, settingsPath, 'adminAuth'), { password: newInput });
                window.closeChangePwdModal();
                window.showMessage('密碼修改成功！');
            } catch(e) {
                console.error(e);
                err.textContent = '儲存失敗，請重試。';
                err.classList.remove('hidden');
            }
        };

        // UI Rendering Functions
        
        window.renderFrontendList = function() {
            const container = document.getElementById('frontendAlbumsContainer');
            const emptyState = document.getElementById('emptyState');
            const searchQ = document.getElementById('searchInput').value.toLowerCase();
            const catId = document.getElementById('filterCategory').value;
            const month = document.getElementById('filterMonth').value;

            container.innerHTML = '';
            
            let filtered = window.albums.filter(album => {
                const matchSearch = album.title.toLowerCase().includes(searchQ) || (album.desc && album.desc.toLowerCase().includes(searchQ));
                const matchCat = catId === 'all' || album.categoryId === catId;
                const matchMonth = month === 'all' || album.date.substring(0,7) === month;
                return matchSearch && matchCat && matchMonth;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            filtered.forEach((album) => {
                const catName = window.getCategoryName(album.categoryId);
                const bgImageOrColor = album.coverUrl 
                    ? `background-image: url('${album.coverUrl}'); background-size: cover; background-position: center;`
                    : `background: linear-gradient(135deg, ${window.stringToColor(album.title)}, ${window.stringToColor(catName)})`;

                const shortDesc = album.desc ? `<p class="text-slate-500 text-sm mt-2 line-clamp-2">${album.desc}</p>` : '';

                const el = document.createElement('div');
                el.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col md:flex-row album-card-hover group";
                el.innerHTML = `
                    <!-- Thumbnail -->
                    <div class="md:w-64 h-48 md:h-auto flex-shrink-0 relative overflow-hidden">
                        <div class="absolute inset-0 transition-transform duration-500 group-hover:scale-105" style="${bgImageOrColor}">
                            ${!album.coverUrl ? `<div class="absolute inset-0 flex items-center justify-center bg-black/20 backdrop-blur-sm"><span class="text-white font-bold text-xl drop-shadow-md px-4 text-center leading-tight">${album.title}</span></div>` : ''}
                        </div>
                        <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-full font-medium">
                            <i class="fa-solid fa-folder-open mr-1"></i> ${catName}
                        </div>
                    </div>
                    
                    <!-- Content -->
                    <div class="p-5 flex-grow flex flex-col justify-center">
                        <div class="flex items-center gap-3 mb-2 text-sm text-slate-500 font-medium">
                            <span><i class="fa-regular fa-calendar text-teal-600 mr-1"></i> ${window.formatDate(album.date)}</span>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 leading-snug">${album.title}</h3>
                        ${shortDesc}
                        <div class="mt-4 pt-4 border-t border-slate-100 flex flex-wrap gap-3">
                            <a href="${album.url}" target="_blank" class="inline-flex items-center gap-2 bg-teal-50 text-teal-700 hover:bg-teal-600 hover:text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm border border-teal-100 hover:border-teal-600">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> 開啟相簿
                            </a>
                        </div>
                    </div>

                    <!-- Short URL & QR Code (Right side layout) -->
                    <div class="bg-slate-50 md:w-56 p-5 border-t md:border-t-0 md:border-l border-slate-200 flex flex-col items-center justify-center flex-shrink-0">
                        <div class="text-xs text-slate-500 font-medium mb-3">手機掃描立即瀏覽</div>
                        <div id="qr-${album.id}" class="bg-white p-2 rounded-lg shadow-sm border border-slate-200 mb-3 transition-transform hover:scale-105"></div>
                        <div class="w-full flex items-center bg-white border border-slate-300 rounded overflow-hidden">
                            <input type="text" value="${album.shortUrl}" readonly class="w-full text-xs px-2 py-1.5 text-slate-600 outline-none bg-transparent">
                            <button onclick="window.copyText('${album.shortUrl}')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1.5 transition-colors border-l border-slate-300" title="複製短網址">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(el);

                // Generate QR Code inside the specific container
                setTimeout(() => {
                    const qrContainer = document.getElementById(`qr-${album.id}`);
                    if(qrContainer) {
                        qrContainer.innerHTML = ''; // clear if any
                        new QRCode(qrContainer, {
                            text: album.url,
                            width: 100,
                            height: 100,
                            colorDark : "#0f172a",
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.L
                        });
                    }
                }, 10); // slight delay to ensure DOM is ready
            });
        };

        
        window.renderAdminCategoryList = function() {
            const list = document.getElementById('adminCategoryList');
            list.innerHTML = window.categories.map(cat => `
                <li class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-lg border border-slate-100">
                    <span class="text-sm font-medium text-slate-700">${cat.name}</span>
                    <button onclick="deleteCategory('${cat.id}', event)" class="text-slate-400 hover:text-red-500 transition px-2 py-1" title="刪除分類">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </li>
            `).join('');
        };

        window.renderAdminData = function() {
            window.renderAdminCategoryList();
            
            const tbody = document.getElementById('adminAlbumList');
            if (window.albums.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-slate-500">尚無相簿資料</td></tr>`;
                return;
            }

            tbody.innerHTML = window.albums.map(album => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-3 whitespace-nowrap text-slate-600">${window.formatDate(album.date)}</td>
                    <td class="px-4 py-3 whitespace-nowrap"><span class="bg-teal-50 text-teal-700 px-2.5 py-1 rounded-full text-xs font-medium border border-teal-100">${window.getCategoryName(album.categoryId)}</span></td>
                    <td class="px-4 py-3 font-medium text-slate-800">${album.title}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-right space-x-2">
                        <button onclick="editAlbum('${album.id}')" class="text-teal-600 hover:text-teal-800 bg-teal-50 hover:bg-teal-100 p-2 rounded transition" title="編輯">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteAlbum('${album.id}')" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded transition" title="刪除">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        };

        window.updateCategoryDropdowns = function() {
            const filterEl = document.getElementById('filterCategory');
            const formEl = document.getElementById('albumCategory');
            const currentFilter = filterEl.value;
            const currentForm = formEl.value;
            
            const options = window.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            
            filterEl.innerHTML = `<option value="all">所有分類</option>` + options;
            formEl.innerHTML = options;
            
            if (currentFilter && [...filterEl.options].some(o => o.value === currentFilter)) filterEl.value = currentFilter;
            if (currentForm && [...formEl.options].some(o => o.value === currentForm)) formEl.value = currentForm;
        };

        function populateMonthFilter() {
            const filterMonth = document.getElementById('filterMonth');
            const currentVal = filterMonth.value;
            const months = new Set();
            
            window.albums.forEach(a => {
                if(a.date) months.add(a.date.substring(0,7));
            });
            
            const sortedMonths = Array.from(months).sort().reverse();
            filterMonth.innerHTML = `<option value="all">所有月份</option>` + 
                sortedMonths.map(m => `<option value="${m}">${m.replace('-','年')}月</option>`).join('');
                
            if(currentVal && [...filterMonth.options].some(o => o.value === currentVal)) {
                filterMonth.value = currentVal;
            }
        }

        // View Switching & Auth Gates
        window.switchView = function(view) {
            if (view === 'admin' && !window.isAdminAuthed) {
                window.openPwdModal();
                return;
            }

            const frontView = document.getElementById('view-frontend');
            const adminView = document.getElementById('view-admin');
            const btnFront = document.getElementById('btn-view-frontend');
            const btnAdmin = document.getElementById('btn-view-admin');

            if (view === 'frontend') {
                frontView.classList.remove('hidden');
                adminView.classList.add('hidden');
                btnFront.className = "px-4 py-2 rounded-md font-medium transition-all duration-200 bg-white text-teal-800 shadow-sm text-sm sm:text-base";
                btnAdmin.className = "px-4 py-2 rounded-md font-medium transition-all duration-200 text-teal-100 hover:text-white hover:bg-teal-600 text-sm sm:text-base";
            } else {
                frontView.classList.add('hidden');
                adminView.classList.remove('hidden');
                btnAdmin.className = "px-4 py-2 rounded-md font-medium transition-all duration-200 bg-white text-teal-800 shadow-sm text-sm sm:text-base";
                btnFront.className = "px-4 py-2 rounded-md font-medium transition-all duration-200 text-teal-100 hover:text-white hover:bg-teal-600 text-sm sm:text-base";
                window.renderAdminData();
            }
        };

        window.verifyPassword = function() {
            const input = document.getElementById('adminPwdInput').value;
            if (input === window.adminPassword) {
                window.closePwdModal();
                window.isAdminAuthed = true;
                window.switchView('admin');
            } else {
                const err = document.getElementById('pwdError');
                err.textContent = '密碼錯誤，請重試。';
                err.classList.remove('hidden');
            }
        };

        // Modals & Forms Helpers
        window.openPwdModal = () => {
            document.getElementById('adminPwdInput').value = '';
            document.getElementById('pwdError').classList.add('hidden');
            document.getElementById('pwdModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('adminPwdInput').focus(), 100);
        };
        window.closePwdModal = () => document.getElementById('pwdModal').classList.add('hidden');

        window.openChangePwdModal = () => {
            document.getElementById('oldPwdInput').value = '';
            document.getElementById('newPwdInput').value = '';
            document.getElementById('changePwdError').classList.add('hidden');
            document.getElementById('changePwdModal').classList.remove('hidden');
        };
        window.closeChangePwdModal = () => document.getElementById('changePwdModal').classList.add('hidden');

        let confirmAction = null;
        window.openDeleteConfirm = (action) => {
            confirmAction = action;
            document.getElementById('deleteModal').classList.remove('hidden');
        };
        window.closeDeleteModal = () => document.getElementById('deleteModal').classList.add('hidden');
        
        document.getElementById('btnConfirmDelete').addEventListener('click', () => {
            if (confirmAction) confirmAction();
            window.closeDeleteModal();
        });

        window.resetForm = () => {
            document.getElementById('editAlbumId').value = '';
            document.getElementById('albumTitle').value = '';
            document.getElementById('albumDate').value = '';
            document.getElementById('albumUrl').value = '';
            document.getElementById('albumCoverUrl').value = '';
            document.getElementById('albumDesc').value = '';
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus-circle text-teal-500"></i> 新增相簿資料';
            document.getElementById('coverUrlWarning').classList.add('hidden');
        };

        window.checkCoverUrlWarning = () => {
            const val = document.getElementById('albumCoverUrl').value;
            const warning = document.getElementById('coverUrlWarning');
            if (val.includes('photos.google.com/share')) {
                warning.classList.remove('hidden');
            } else {
                warning.classList.add('hidden');
            }
        };

        window.showMessage = (text, isError = false) => {
            const box = document.getElementById('msgBox');
            const span = document.getElementById('msgText');
            const icon = box.querySelector('i');
            
            span.textContent = text;
            if(isError) {
                icon.className = 'fa-solid fa-triangle-exclamation text-red-400';
                box.classList.replace('bg-slate-800', 'bg-red-900');
            } else {
                icon.className = 'fa-solid fa-circle-check text-teal-400';
                box.classList.replace('bg-red-900', 'bg-slate-800');
            }
            
            box.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                box.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        };

        window.copyText = (text) => {
            try {
                // Since this runs in an iframe often, use older execCommand fallback
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                window.showMessage('已複製短網址');
            } catch (err) {
                console.error(err);
            }
        };

        // Formatting utilities
        window.getCategoryName = (id) => {
            const cat = window.categories.find(c => c.id === id);
            return cat ? cat.name : '未分類';
        };

        window.formatDate = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,'0')}月${String(d.getDate()).padStart(2,'0')}日`;
        };

        window.stringToColor = (str) => {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            // Generate darker, richer colors for gradients
            let color = '#';
            for (let i = 0; i < 3; i++) {
                let value = (hash >> (i * 8)) & 0xFF;
                value = Math.max(30, Math.min(180, value)); // Constrain brightness
                color += ('00' + value.toString(16)).substr(-2);
            }
            return color;
        };

    </script>
</body>
</html>
